                  b.setTextSize(16);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(blue);

                  return b;
              }

              private EditText input(String hint) {

                  EditText e = new EditText(this);

                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setPadding(24,18,24,18);

                  return e;
