              private TextView text(String value, float size) {

                  TextView t = new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(dark);
                  t.setPadding(24,20,24,20);

                  return t;
              }

              private Button button(String value) {

