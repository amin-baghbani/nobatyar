                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/ir/kalavira/nobatyar/MainActivity.java <<'EOF'
          package ir.kalavira.nobatyar;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {

              private static final String API =
                      "https://kalavira.ir/api/";

              private SharedPreferences prefs;
              private LinearLayout root;
              private TextView title;

              private int dark = Color.rgb(15, 23, 42);
              private int blue = Color.rgb(37, 99, 235);
              private int light = Color.rgb(248, 250, 252);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences("nobatyar", MODE_PRIVATE);

                  showStart();
              }

              private void showStart() {

                  if (prefs.getString("token", "").isEmpty()) {
                      showLogin();
                  } else {
                      showHome();
                  }
              }

              private void base(String pageTitle) {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(30, 35, 30, 30);
                  root.setBackgroundColor(light);
                  root.setGravity(Gravity.RIGHT);

                  title = new TextView(this);
                  title.setText(pageTitle);
                  title.setTextSize(28);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setTextColor(dark);
                  title.setGravity(Gravity.RIGHT);
                  title.setPadding(0, 0, 0, 30);

                  root.addView(title);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              private EditText input(String hint) {

                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setTextSize(17);
                  e.setSingleLine(true);
                  e.setGravity(Gravity.RIGHT);
                  e.setPadding(25, 20, 25, 20);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 0, 0, 18);
                  e.setLayoutParams(p);

                  root.addView(e);

                  return e;
              }

              private Button button(String text) {

                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextSize(17);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(blue);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 0, 0, 15);
                  b.setLayoutParams(p);

                  root.addView(b);

                  return b;
              }

              private void message(String text) {
                  Toast.makeText(this, text, Toast.LENGTH_LONG).show();
              }

              private void showLogin() {

                  base("ورود به نوبت‌یار");

                  TextView sub = new TextView(this);
                  sub.setText("برای رزرو نوبت وارد حساب خود شوید");
                  sub.setTextSize(17);
                  sub.setTextColor(Color.DKGRAY);
                  sub.setGravity(Gravity.RIGHT);
                  root.addView(sub);

                  EditText phone = input("شماره موبایل");

                  EditText password = input("رمز عبور");
                  password.setInputType(129);

                  Button login = button("ورود");

                  login.setOnClickListener(v -> {

                      if (phone.getText().toString().trim().isEmpty()
                              || password.getText().toString().isEmpty()) {

                          message("شماره موبایل و رمز عبور را وارد کنید");
                          return;
                      }

                      login.setEnabled(false);

                      new Thread(() -> {

                          try {

                              JSONObject data = new JSONObject();

                              data.put(
                                      "action",
                                      "login");

                              data.put(
                                      "phone",
                                      phone.getText().toString().trim());

                              data.put(
                                      "password",
                                      password.getText().toString());

                              String response =
                                      request(
                                              "auth.php",
                                              "POST",
                                              data.toString(),
                                              "");

                              JSONObject json =
                                      new JSONObject(response);

                              if (json.optBoolean("ok")) {

                                  String token =
                                          json.optString("token");

                                  prefs.edit()
                                          .putString("token", token)
                                          .apply();

                                  runOnUiThread(this::showHome);

                              } else {

                                  runOnUiThread(() ->
                                          message(
                                                  json.optString(
                                                          "message",
                                                          "ورود ناموفق بود")));

                              }

                          } catch (Exception e) {

                              runOnUiThread(() ->
                                      message(
                                              "خطا در ارتباط با سرور"));

                          }

                          runOnUiThread(() ->
                                  login.setEnabled(true));

                      }).start();

                  });

                  Button register = button("ثبت‌نام");

                  register.setBackgroundColor(Color.DKGRAY);

                  register.setOnClickListener(v -> showRegister());
              }

              private void showRegister() {

                  base("ثبت‌نام در نوبت‌یار");

                  EditText name = input("نام و نام خانوادگی");
                  EditText phone = input("شماره موبایل");
                  EditText email = input("ایمیل - اختیاری");

                  EditText password = input("رمز عبور");
                  password.setInputType(129);

                  Button register = button("ایجاد حساب");

                  register.setOnClickListener(v -> {

                      if (name.getText().toString().trim().isEmpty()
                              || phone.getText().toString().trim().isEmpty()
                              || password.getText().toString().isEmpty()) {

                          message("نام، شماره موبایل و رمز عبور الزامی است");
                          return;
                      }

                      register.setEnabled(false);

                      new Thread(() -> {

                          try {

                              JSONObject data = new JSONObject();

                              data.put(
                                      "action",
                                      "register");

                              data.put(
                                      "name",
                                      name.getText().toString().trim());

                              data.put(
                                      "phone",
                                      phone.getText().toString().trim());

                              data.put(
                                      "email",
                                      email.getText().toString().trim());

                              data.put(
                                      "password",
                                      password.getText().toString());

                              data.put(
                                      "role",
                                      "customer");

                              String response =
                                      request(
                                              "auth.php",
                                              "POST",
                                              data.toString(),
                                              "");

                              JSONObject json =
                                      new JSONObject(response);

                              if (json.optBoolean("ok")) {

                                  String token =
                                          json.optString("token");

                                  prefs.edit()
                                          .putString("token", token)
                                          .apply();

                                  runOnUiThread(this::showHome);

                              } else {

                                  runOnUiThread(() ->
                                          message(
                                                  json.optString(
                                                          "message",
                                                          "ثبت‌نام انجام نشد")));

                              }

                          } catch (Exception e) {

                              runOnUiThread(() ->
                                      message(
                                              "خطا در ارتباط با سرور"));

                          }

                          runOnUiThread(() ->
                                  register.setEnabled(true));

                      }).start();

                  });

                  Button back = button("بازگشت به ورود");
                  back.setBackgroundColor(Color.DKGRAY);
                  back.setOnClickListener(v -> showLogin());
              }

              private void showHome() {

                  base("نوبت‌یار");

                  TextView welcome = new TextView(this);

                  welcome.setText(
                          "به نوبت‌یار خوش آمدید\n\nاز اینجا می‌توانید کسب‌وکار موردنظر را انتخاب و نوبت رزرو کنید.");

                  welcome.setTextSize(18);
                  welcome.setTextColor(dark);
                  welcome.setGravity(Gravity.RIGHT);
                  welcome.setPadding(0, 0, 0, 30);

                  root.addView(welcome);

                  Button businesses =
                          button("🏢 مشاهده کسب‌وکارها");

                  businesses.setOnClickListener(
                          v -> loadBusinesses());

                  Button appointments =
                          button("📅 نوبت‌های من");

                  appointments.setOnClickListener(
                          v -> loadMyAppointments());

                  Button profile =
                          button("👤 حساب کاربری");

                  profile.setOnClickListener(
                          v -> showProfile());

                  Button logout =
                          button("خروج از حساب");

                  logout.setBackgroundColor(Color.DKGRAY);

                  logout.setOnClickListener(v -> {

                      prefs.edit()
                              .clear()
                              .apply();

                      showLogin();
                  });
              }

              private void loadBusinesses() {

                  base("انتخاب کسب‌وکار");

                  TextView loading =
                          new TextView(this);

                  loading.setText("در حال دریافت کسب‌وکارها...");
                  loading.setTextSize(18);
                  loading.setGravity(Gravity.RIGHT);

                  root.addView(loading);

                  new Thread(() -> {

                      try {

                          String response =
                                  request(
                                          "bussineses.php",
                                          "GET",
                                          "",
                                          "");

                          JSONObject json =
                                  new JSONObject(response);

                          JSONArray items =
                                  json.optJSONArray("businesses");

                          runOnUiThread(() -> {

                              root.removeView(loading);

                              if (items == null
                                      || items.length() == 0) {

                                  TextView empty =
                                          new TextView(this);

                                  empty.setText(
                                          "در حال حاضر کسب‌وکار فعالی ثبت نشده است.");

                                  empty.setTextSize(17);
                                  empty.setGravity(Gravity.RIGHT);

                                  root.addView(empty);
                                  return;
                              }

                              for (int i = 0;
                                   i < items.length();
                                   i++) {

                                  try {

                                      JSONObject item =
                                              items.getJSONObject(i);

                                      int id =
                                              item.optInt("id");

                                      String name =
                                              item.optString(
                                                      "name",
                                                      "کسب‌وکار");

                                      Button b =
                                              button("🏢 " + name);

                                      b.setOnClickListener(
                                              v -> loadServices(id, name));

                                  } catch (Exception ignored) {
                                  }
                              }
                          });

                      } catch (Exception e) {

                          runOnUiThread(() ->
                                  message(
                                          "خطا در دریافت کسب‌وکارها"));
                      }

                  }).start();
              }

              private void loadServices(
                      int businessId,
                      String businessName) {

                  base(businessName);

                  TextView loading =
                          new TextView(this);

                  loading.setText(
                          "در حال دریافت خدمات...");

                  loading.setTextSize(18);
                  loading.setGravity(Gravity.RIGHT);

                  root.addView(loading);

                  new Thread(() -> {

                      try {

                          String response =
                                  request(
                                          "services.php?business_id="
                                                  + businessId,
                                          "GET",
                                          "",
                                          prefs.getString(
                                                  "token",
                                                  ""));

                          JSONObject json =
                                  new JSONObject(response);

                          JSONArray services =
                                  json.optJSONArray("services");

                          runOnUiThread(() -> {

                              root.removeView(loading);

                              if (services == null
                                      || services.length() == 0) {

                                  TextView empty =
                                          new TextView(this);

                                  empty.setText(
                                          "برای این کسب‌وکار هنوز خدمتی ثبت نشده است.");

                                  empty.setTextSize(17);
                                  empty.setGravity(Gravity.RIGHT);

                                  root.addView(empty);
                                  return;
                              }

                              for (int i = 0;
                                   i < services.length();
                                   i++) {

                                  try {

                                      JSONObject service =
                                              services.getJSONObject(i);

                                      int serviceId =
                                              service.optInt("id");

                                      String serviceName =
                                              service.optString(
                                                      "name",
                                                      "خدمت");

                                      int price =
                                              service.optInt("price");

                                      int duration =
                                              service.optInt(
                                                      "duration_minutes");

                                      Button b =
                                              button(
                                                      serviceName
                                                              + "\n"
                                                              + formatNumber(price)
                                                              + " ریال"
                                                              + " | "
                                                              + duration
                                                              + " دقیقه");

                                      b.setOnClickListener(
                                              v -> showBooking(
                                                      businessId,
                                                      serviceId,
                                                      serviceName));

                                  } catch (Exception ignored) {
                                  }
                              }
                          });

                      } catch (Exception e) {

                          runOnUiThread(() ->
                                  message(
                                          "خطا در دریافت خدمات"));
                      }

                  }).start();
              }

              private void showBooking(
                      int businessId,
                      int serviceId,
                      String serviceName) {

                  base("رزرو نوبت");

                  TextView selected =
