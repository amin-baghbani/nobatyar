                  selected.setText(
                          "خدمت انتخاب‌شده:\n"
                                  + serviceName);

                  selected.setTextSize(20);
                  selected.setTextColor(dark);
                  selected.setGravity(Gravity.RIGHT);
                  selected.setPadding(0, 0, 0, 25);

                  root.addView(selected);

                  EditText date =
                          input("تاریخ میلادی: 2026-09-30");

                  EditText time =
                          input("ساعت شروع: 10:00");

                  EditText notes =
                          input("توضیحات - اختیاری");

                  Button reserve =
                          button("ثبت نوبت");

                  reserve.setOnClickListener(v -> {

                      String d =
                              date.getText()
                                      .toString()
                                      .trim();

                      String t =
                              time.getText()
                                      .toString()
                                      .trim();

                      if (d.isEmpty()
                              || t.isEmpty()) {

                          message(
                                  "تاریخ و ساعت را وارد کنید");

                          return;
                      }

                      reserve.setEnabled(false);

                      new Thread(() -> {

                          try {

                              JSONObject data =
                                      new JSONObject();

                              data.put(
                                      "business_id",
                                      businessId);

                              data.put(
                                      "service_id",
                                      serviceId);

                              data.put(
                                      "appointment_date",
                                      d);

                              data.put(
                                      "start_time",
                                      t);

                              data.put(
                                      "notes",
                                      notes.getText()
                                              .toString()
                                              .trim());

                              String response =
                                      request(
                                              "appointments.php",
                                              "POST",
                                              data.toString(),
                                              prefs.getString(
                                                      "token",
                                                      ""));

                              JSONObject json =
                                      new JSONObject(response);

                              if (json.optBoolean("ok")) {

                                  runOnUiThread(() -> {

                                      message(
                                              "نوبت با موفقیت ثبت شد");

                                      showHome();
                                  });

                              } else {

                                  runOnUiThread(() ->
                                          message(
                                                  json.optString(
                                                          "message",
                                                          "ثبت نوبت ناموفق بود")));
                              }

                          } catch (Exception e) {

                              runOnUiThread(() ->
                                      message(
                                              "خطا در ثبت نوبت"));
                          }

                          runOnUiThread(() ->
                                  reserve.setEnabled(true));

