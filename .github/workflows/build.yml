                  Button login = button("ورود");

                  root.addView(login);

                  Button register = button("ثبت‌نام");

                  root.addView(register);

                  TextView status = text("",15);

                  root.addView(status);

                  login.setOnClickListener(v -> {

                      String p = phone.getText().toString().trim();
                      String pass = password.getText().toString();

                      if(p.isEmpty() || pass.isEmpty()) {

                          status.setText(
                                  "شماره موبایل و رمز عبور را وارد کنید.");

                          return;
                      }

                      status.setText("در حال ورود...");

                      new Thread(() -> {

                          try {

                              JSONObject body = new JSONObject();

                              body.put("action","login");
                              body.put("phone",p);
                              body.put("password",pass);

