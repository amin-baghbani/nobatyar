name: "Nobatyar APK"

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        shell: bash
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle

          mkdir -p app/src/main/java/ir/kalavira/nobatyar
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Nobatyar"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.kalavira.nobatyar'
              compileSdk 35

              defaultConfig {
                  applicationId 'ir.kalavira.nobatyar"
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>

              <application
                  android:allowBackup="true"
                  android:label="نوبت‌یار"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/ir/kalavira/nobatyar/MainActivity.java <<'EOF'
          package ir.kalavira.nobatyar;

          import android.app.*;
          import android.os.*;
          import android.content.*;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.*;
          import android.widget.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.util.*;

          public class MainActivity extends Activity {

              private static final String API =
                      "https://kalavira.ir/api/";

              private LinearLayout root;
              private android.content.SharedPreferences prefs;
              private String token = "";

              private int navy = Color.rgb(15,23,42);
              private int blue = Color.rgb(37,99,235);
              private int green = Color.rgb(22,163,74);
              private int red = Color.rgb(220,38,38);
              private int gray = Color.rgb(100,116,139);

              @Override
              protected void onCreate(Bundle b) {

                  super.onCreate(b);

                  prefs = getSharedPreferences(
                          "nobatyar",
                          MODE_PRIVATE
                  );

                  token = prefs.getString("token","");

                  if(token.length() > 0) {
                      home();
                  } else {
                      login();
                  }
              }

              private void base() {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(35,35,35,35);
                  root.setBackgroundColor(Color.WHITE);

                  ScrollView scroll = new ScrollView(this);
                  scroll.addView(root);

                  setContentView(scroll);
              }

              private TextView text(
                      String s,
                      int size,
                      int color) {

                  TextView t = new TextView(this);

                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setPadding(10,15,10,15);
                  t.setGravity(Gravity.RIGHT);

                  return t;
              }

              private EditText input(
                      String hint) {

                  EditText e = new EditText(this);

                  e.setHint(hint);
                  e.setTextSize(16);
                  e.setPadding(20,15,20,15);

                  root.addView(e,new LinearLayout.LayoutParams(
                          -1,
                          -2
                  ));

                  return e;
              }

              private Button button(
                      String title,
                      View.OnClickListener click) {

                  Button b = new Button(this);

                  b.setText(title);
                  b.setTextSize(16);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(blue);
                  b.setOnClickListener(click);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(-1,65);

                  p.setMargins(0,10,0,10);

                  root.addView(b,p);

                  return b;
              }

              private void title(String s) {

                  TextView t = text(
                          s,
                          28,
                          navy
                  );

                  t.setTypeface(
                          Typeface.DEFAULT,
                          Typeface.BOLD
                  );

                  t.setGravity(Gravity.CENTER);

                  root.addView(t);
              }

              private void login() {

                  base();

                  title("نوبت‌یار");

                  root.addView(
                          text(
                                  "ورود به حساب کاربری",
                                  18,
                                  gray
                          )
                  );

                  EditText phone =
                          input("شماره موبایل");

                  EditText password =
                          input("رمز عبور");

                  password.setInputType(
                          129
                  );

                  button(
                          "ورود",
                          v -> {

                              JSONObject data =
                                      new JSONObject();

                              try {

                                  data.put(
                                          "action",
                                          "login"
                                  );

                                  data.put(
                                          "phone",
                                          phone.getText()
                                                  .toString()
                                  );

                                  data.put(
                                          "password",
                                          password.getText()
                                                  .toString()
                                  );

                              } catch(Exception e) {}

                              request(
                                      "auth.php",
                                      data,
                                      false,
                                      response -> {

                                  try {

                                      if(response
                                              .getBoolean("ok")) {

                                          token =
                                              response
                                              .getString("token");

                                          prefs.edit()
                                              .putString(
                                                  "token",
                                                  token
                                              )
                                              .apply();

                                          home();

                                      } else {

                                          toast(
                                              response.optString(
                                                  "message",
                                                  "ورود ناموفق بود"
                                              )
                                          );
                                      }

                                  } catch(Exception e) {

                                      toast(
                                          "پاسخ نامعتبر از سرور"
                                      );
                                  }

                              });
                          }
                  );

                  button(
                          "ثبت‌نام",
                          v -> register()
                  );
              }

              private void register() {

                  base();

                  title("ثبت‌نام");

                  EditText name =
                          input("نام و نام خانوادگی");

                  EditText phone =
                          input("شماره موبایل");

                  EditText email =
                          input("ایمیل");

                  EditText password =
                          input("رمز عبور");

                  password.setInputType(129);

                  button(
                          "ساخت حساب",
                          v -> {

                              JSONObject data =
                                      new JSONObject();

                              try {

                                  data.put(
                                      "action",
                                      "register"
                                  );

                                  data.put(
                                      "name",
                                      name.getText().toString()
                                  );

                                  data.put(
                                      "phone",
                                      phone.getText().toString()
                                  );

                                  data.put(
                                      "email",
                                      email.getText().toString()
                                  );

                                  data.put(
                                      "password",
                                      password.getText().toString()
                                  );

                              } catch(Exception e) {}

                              request(
                                  "auth.php",
                                  data,
                                  false,
                                  response -> {

                                      try {

                                          if(response
                                              .getBoolean("ok")) {

                                              toast(
                                                  "ثبت‌نام انجام شد"
                                              );

                                              login();

                                          } else {

                                              toast(
                                                  response.optString(
                                                      "message",
                                                      "ثبت‌نام ناموفق بود"
                                                  )
                                              );
                                          }

                                      } catch(Exception e) {

                                          toast(
                                              "خطا در پاسخ سرور"
                                          );
                                      }
                                  }
                              );
                          }
                  );

                  button(
                          "بازگشت به ورود",
                          v -> login()
                  );
              }

              private void home() {

                  base();

                  title("نوبت‌یار");

                  root.addView(
                          text(
                              "سامانه رزرو نوبت",
                              18,
                              gray
                          )
                  );

                  button(
                          "🏢 کسب‌وکارها",
                          v -> businesses()
                  );

                  button(
                          "📅 نوبت‌های من",
                          v -> appointments()
                  );

                  button(
                          "👤 پروفایل",
                          v -> profile()
                  );

                  button(
                          "🚪 خروج",
                          v -> {

                              prefs.edit()
                                  .remove("token")
                                  .apply();

                              token = "";

                              login();
                          }
                  );
              }

              private void businesses() {

                  base();

                  title("کسب‌وکارها");

                  request(
                      "bussineses.php",
                      null,
                      true,
                      response -> {

                          try {

                              JSONArray arr =
                                  response
                                  .getJSONArray("businesses");

                              for(int i=0;
                                  i<arr.length();
                                  i++) {

                                  JSONObject b =
                                      arr.getJSONObject(i);

                                  final int id =
                                      b.getInt("id");

                                  TextView item =
                                      text(
                                          b.optString(
                                              "name",
                                              "بدون نام"
                                          ) +
                                          "\n" +
                                          b.optString(
                                              "type",
                                              ""
                                          ),
                                          18,
                                          navy
                                      );

                                  item.setBackgroundColor(
                                      Color.rgb(
                                          241,245,249
                                      )
                                  );

                                  item.setOnClickListener(
                                      v -> services(id)
                                  );

                                  root.addView(
                                      item,
                                      new LinearLayout.LayoutParams(
                                          -1,
                                          -2
                                      )
                                  );
                              }

                              if(arr.length()==0) {

                                  root.addView(
                                      text(
                                          "هنوز کسب‌وکاری ثبت نشده است.",
                                          17,
                                          gray
                                      )
                                  );
                              }

                          } catch(Exception e) {

                              toast(
                                  "خطا در دریافت کسب‌وکارها"
                              );
                          }
                      }
                  );

                  button(
                      "بازگشت",
                      v -> home()
                  );
              }

              private void services(int businessId) {

                  base();

                  title("خدمات");

                  request(
                      "services.php?business_id="+businessId,
                      null,
                      true,
                      response -> {

                          try {

                              JSONArray arr =
                                  response
                                  .getJSONArray("services");

                              for(int i=0;
                                  i<arr.length();
                                  i++) {

                                  JSONObject s =
                                      arr.getJSONObject(i);

                                  int serviceId =
                                      s.getInt("id");

                                  String name =
                                      s.optString(
                                          "name",
                                          "خدمت"
                                      );

                                  String price =
                                      s.optString(
                                          "price",
                                          "0"
                                      );

                                  String duration =
                                      s.optString(
                                          "duration_minutes",
                                          "0"
                                      );

                                  Button b =
                                      new Button(this);

                                  b.setText(
                                      name +
                                      "\nقیمت: " +
                                      price +
                                      " ریال" +
                                      "\nمدت: " +
                                      duration +
                                      " دقیقه"
                                  );

                                  final int sid =
                                      serviceId;

                                  b.setOnClickListener(
                                      v -> booking(
                                          businessId,
                                          sid,
                                          name
                                      )
                                  );

                                  root.addView(
                                      b,
                                      new LinearLayout.LayoutParams(
                                          -1,
                                          -2
                                      )
                                  );
                              }

                          } catch(Exception e) {

                              toast(
                                  "خطا در دریافت خدمات"
                              );
                          }
                      }
                  );

                  button(
                      "بازگشت",
                      v -> businesses()
                  );
              }

              private void booking(
                      int businessId,
                      int serviceId,
                      String serviceName) {

                  base();

                  title("رزرو نوبت");

                  root.addView(
                      text(
                          serviceName,
                          20,
                          navy
                      )
                  );

                  EditText date =
                      input(
                          "تاریخ میلادی مثال 2026-10-01"
                      );

                  EditText time =
                      input(
                          "ساعت مثال 14:00"
                      );

                  EditText notes =
                      input(
                          "توضیحات"
                      );

                  button(
                      "ثبت نوبت",
                      v -> {

                          JSONObject data =
                              new JSONObject();

                          try {

                              data.put(
                                  "business_id",
                                  businessId
                              );

                              data.put(
                                  "service_id",
                                  serviceId
                              );

                              data.put(
                                  "appointment_date",
                                  date.getText()
                                      .toString()
                              );

                              data.put(
                                  "start_time",
                                  time.getText()
                                      .toString()
                              );

                              data.put(
                                  "notes",
                                  notes.getText()
                                      .toString()
                              );

                          } catch(Exception e) {}

                          request(
                              "appointments.php",
                              data,
                              true,
                              response -> {

                                  toast(
                                      response.optString(
                                          "message",
                                          "عملیات انجام شد"
                                      )
                                  );

                                  if(response.optBoolean(
                                      "ok",
                                      false)) {

                                      appointments();
                                  }
                              }
                          );
                      }
                  );

                  button(
                      "بازگشت",
                      v -> services(businessId)
                  );
              }

              private void appointments() {

                  base();

                  title("نوبت‌های من");

                  request(
                      "appointments.php",
                      null,
                      true,
                      response -> {

                          try {

                              JSONArray arr =
                                  response
                                  .getJSONArray(
                                      "appointments"
                                  );

                              for(int i=0;
                                  i<arr.length();
                                  i++) {

                                  JSONObject a =
                                      arr.getJSONObject(i);

                                  String s =
                                      "تاریخ: " +
                                      a.optString(
                                          "appointment_date"
                                      ) +
                                      "\nساعت: " +
                                      a.optString(
                                          "start_time"
                                      ) +
                                      "\nوضعیت: " +
                                      a.optString(
                                          "status"
                                      );

                                  root.addView(
                                      text(
                                          s,
                                          17,
                                          navy
                                      )
                                  );
                              }

                              if(arr.length()==0) {

                                  root.addView(
                                      text(
                                          "نوبتی ثبت نشده است.",
                                          17,
                                          gray
                                      )
                                  );
                              }

                          } catch(Exception e) {

                              toast(
                                  "خطا در دریافت نوبت‌ها"
                              );
                          }
                      }
                  );

                  button(
                      "بازگشت",
                      v -> home()
                  );
              }

              private void profile() {

                  base();

                  title("پروفایل");

                  request(
                      "me.php",
                      null,
                      true,
                      response -> {

                          try {

                              JSONObject u =
                                  response.getJSONObject(
                                      "user"
                                  );

                              root.addView(
                                  text(
                                      "نام: " +
                                      u.optString("name") +
                                      "\nموبایل: " +
                                      u.optString("phone") +
                                      "\nایمیل: " +
                                      u.optString("email") +
                                      "\nنقش: " +
                                      u.optString("role"),
                                      18,
                                      navy
                                  )
                              );

                          } catch(Exception e) {

                              toast(
                                  "خطا در دریافت پروفایل"
                              );
                          }
                      }
                  );

                  button(
                      "بازگشت",
                      v -> home()
                  );
              }

              private interface Callback {
                  void done(JSONObject response);
              }

              private void request(
                      String endpoint,
                      JSONObject data,
                      boolean auth,
                      Callback callback) {

                  new Thread(() -> {

                      HttpURLConnection c = null;

                      try {

                          URL url =
                              new URL(
                                  API + endpoint
                              );

                          c =
                              (HttpURLConnection)
                              url.openConnection();

                          c.setRequestMethod(
                              data == null
                              ? "GET"
                              : "POST"
                          );

                          c.setConnectTimeout(
                              15000
                          );

                          c.setReadTimeout(
                              20000
                          );

                          c.setRequestProperty(
                              "Accept",
                              "application/json"
                          );

                          if(auth &&
                             token.length()>0) {

                              c.setRequestProperty(
                                  "Authorization",
                                  "Bearer " + token
                              );
                          }

                          if(data != null) {

                              c.setRequestProperty(
                                  "Content-Type",
                                  "application/json"
                              );

                              c.setDoOutput(true);

                              OutputStream os =
                                  c.getOutputStream();

                              os.write(
                                  data.toString()
                                      .getBytes("UTF-8")
                              );

                              os.close();
                          }

                          InputStream is;

                          if(c.getResponseCode() >= 400) {
                              is = c.getErrorStream();
                          } else {
                              is = c.getInputStream();
                          }

                          BufferedReader br =
                              new BufferedReader(
                                  new InputStreamReader(
                                      is,
                                      "UTF-8"
                                  )
                              );

                          StringBuilder sb =
                              new StringBuilder();

                          String line;

                          while(
                              (line=br.readLine())
                              != null
                          ) {
                              sb.append(line);
                          }

                          JSONObject result =
                              new JSONObject(
                                  sb.toString()
                              );

                          runOnUiThread(
                              () -> callback.done(result)
                          );

                      } catch(Exception e) {

                          runOnUiThread(
                              () -> toast(
                                  "خطا در ارتباط با سرور"
                              )
                          );

                      } finally {

                          if(c != null) {
                              c.disconnect();
                          }
                      }

                  }).start();
              }

              private void toast(String message) {

                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_LONG
                  ).show();
              }
          }
          EOF

      - name: Fix Android Project
        shell: bash
        run: |
          sed -i 's/applicationId '\''ir.kalavira.nobatyar"/applicationId '\''ir.kalavira.nobatyar'\''/' app/build.gradle

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nobatyar-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
