name: Build Nobatyar Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android Project
        run: |

          mkdir -p app/src/main/java/ir/kalavira/nobatyar
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Nobatyar"

          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ir.kalavira.nobatyar'

              compileSdk 35

              defaultConfig {
                  applicationId 'ir.kalavira.nobatyar'

                  minSdk 24

                  targetSdk 35

                  versionCode 1

                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="نوبت‌یار"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>

                          <action android:name="android.intent.action.MAIN" />

                          <category android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">true</item>

                  <item name="android:statusBarColor">#FFFFFF</item>

                  <item name="android:navigationBarColor">#FFFFFF</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/ir/kalavira/nobatyar/MainActivity.java <<'EOF'
          package ir.kalavira.nobatyar;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);

                  layout.setOrientation(
                      LinearLayout.VERTICAL
                  );

                  layout.setGravity(
                      Gravity.CENTER
                  );

                  layout.setPadding(
                      40,
                      40,
                      40,
                      40
                  );

                  layout.setBackgroundColor(
                      Color.WHITE
                  );

                  TextView title = new TextView(this);

                  title.setText(
                      "نوبت‌یار"
                  );

                  title.setTextSize(
                      32
                  );

                  title.setTextColor(
                      Color.rgb(
                          15,
                          23,
                          42
                      )
                  );

                  title.setGravity(
                      Gravity.CENTER
                  );

                  TextView subtitle = new TextView(this);

                  subtitle.setText(
                      "سامانه رزرو نوبت"
                  );

                  subtitle.setTextSize(
                      18
                  );

                  subtitle.setTextColor(
                      Color.DKGRAY
                  );

                  subtitle.setGravity(
                      Gravity.CENTER
                  );

                  subtitle.setPadding(
                      0,
                      20,
                      0,
                      0
                  );

                  layout.addView(
                      title
                  );

                  layout.addView(
                      subtitle
                  );

                  setContentView(
                      layout
                  );
              }
          }
          EOF

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "================================"
          echo "APK FILES"
          echo "================================"

          find . -type f -name "*.apk" -print

          echo "================================"
          echo "RELEASE DIRECTORY"
          echo "================================"

          ls -lah app/build/outputs/apk/release/ || true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nobatyar-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
