              private String get(
                      String endpoint) throws Exception {

                  URL url =
                          new URL(API + endpoint);

                  HttpURLConnection c =
                          (HttpURLConnection)
                                  url.openConnection();

                  c.setRequestMethod("GET");
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);

                  return read(c);
              }

              private String getAuth(
                      String endpoint) throws Exception {

                  URL url =
                          new URL(API + endpoint);

                  HttpURLConnection c =
                          (HttpURLConnection)
                                  url.openConnection();

                  c.setRequestMethod("GET");
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);

                  c.setRequestProperty(
                          "Authorization",
                          "Bearer " +
                          prefs.getString(
                                  "token",
                                  ""));

                  return read(c);
              }

              private String post(
                      String endpoint,
                      String json) throws Exception {

                  URL url =
                          new URL(API + endpoint);

                  HttpURLConnection c =
                          (HttpURLConnection)
                                  url.openConnection();

                  c.setRequestMethod("POST");
                  c.setDoOutput(true);

                  c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=UTF-8");

                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);

                  OutputStream os =
                          c.getOutputStream();

                  os.write(
                          json.getBytes("UTF-8"));

                  os.close();

                  return read(c);
              }

              private String postAuth(
                      String endpoint,
                      String json) throws Exception {

                  URL url =
                          new URL(API + endpoint);

                  HttpURLConnection c =
                          (HttpURLConnection)
                                  url.openConnection();

                  c.setRequestMethod("POST");
                  c.setDoOutput(true);

                  c.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=UTF-8");

                  c.setRequestProperty(
                          "Authorization",
                          "Bearer " +
                          prefs.getString(
                                  "token",
                                  ""));

                  c.setConnectTimeout(15000);
                  c.setReadTimeout(15000);

                  OutputStream os =
                          c.getOutputStream();

                  os.write(
                          json.getBytes("UTF-8"));

                  os.close();

                  return read(c);
              }

              private String read(
                      HttpURLConnection c)
                      throws Exception {

                  InputStream stream;

                  if(c.getResponseCode() >= 400) {
                      stream = c.getErrorStream();
                  } else {
                      stream = c.getInputStream();
                  }

                  BufferedReader reader =
                          new BufferedReader(
                                  new InputStreamReader(
                                          stream,
                                          "UTF-8"));

                  StringBuilder result =
                          new StringBuilder();

                  String line;

                  while((line = reader.readLine()) != null) {
                      result.append(line);
                  }

                  reader.close();

                  return result.toString();
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nobatyar-apk-final
          path: app/build/outputs/apk/debug/app-debug.apk
